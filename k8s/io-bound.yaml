# IO bound: lê um arquivo de 100 MB direto do disco (O_DIRECT).
# O gargalo é o disco, não CPU nem RAM, então recebe pouco dos dois.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: io-bound
  template:
    metadata:
      labels:
        app: io-bound
    spec:
      containers:
        - name: io-bound
          image: miguelolivrd/io_bound:v1
          ports:
            - containerPort: 8084

          resources:
            requests:
              cpu: "0.25"
              memory: 512Mi
            limits:
              cpu: "0.5"
              memory: 1Gi
