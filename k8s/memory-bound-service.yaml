# Expõe a aplicação memory-bound fora do cluster.
# NodePort abre a porta 30083 no nó do Minikube e encaminha para a porta 8084 do pod.
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
spec:
  type: NodePort
  selector:
    app: memory-bound
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30083
