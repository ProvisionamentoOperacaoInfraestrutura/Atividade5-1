# CPU bound: cálculo de números primos.
# É a aplicação que mais usa processador, então recebe mais vCPUs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-bound
  template:
    metadata:
      labels:
        app: cpu-bound
    spec:
      containers:
        - name: cpu-bound
          image: miguelolivrd/cpu_bound:v1
          ports:
            - containerPort: 8084
          # requests = recursos garantidos (reservados) para o pod
          # limits   = máximo que o pod pode usar (CPU: fica lento; memória: pod é reiniciado)
          # CPU em vCPUs (0.25 = 1/4 de núcleo); memória em Mi (~MB)
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
